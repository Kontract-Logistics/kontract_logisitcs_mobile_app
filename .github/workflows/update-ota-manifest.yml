name: Update OTA Manifest

on:
  release:
    types: [published]

  push:
    branches:
      - main
    paths:
      - .github/workflows/update-ota-manifest.yml

permissions:
  contents: write

jobs:
  update-ota-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest)

          TAG_NAME=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          RELEASE_BODY=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['body'])")

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          {
            echo 'release_body<<EOF'
            echo "$RELEASE_BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update latest.json
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.release.outputs.release_body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os

          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("v")
          release_body = os.environ.get("RELEASE_BODY", "").strip()
          repository = os.environ["GITHUB_REPOSITORY"]

          apk_name = "kontract-express.apk"

          apk_url = (
              f"https://github.com/{repository}/releases/download/"
              f"{tag}/{apk_name}"
          )

          manifest = {
              "version": version,
              "tag": tag,
              "apk": apk_url,
              "changelog": release_body,
          }

          os.makedirs("ota", exist_ok=True)

          with open("ota/latest.json", "w", encoding="utf-8") as file:
              json.dump(
                  manifest,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )
              file.write("\n")

          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Commit and push OTA manifest
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/latest.json

          if git diff --cached --quiet; then
            echo "No changes to latest.json"
            exit 0
          fi

          git commit -m "chore: update OTA manifest for $TAG_NAME"

          git push origin main
