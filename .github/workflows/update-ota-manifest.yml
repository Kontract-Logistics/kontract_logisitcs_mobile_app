name: Update OTA Manifest

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-ota-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${TAG_NAME#v}"
          APK_NAME="kontract-express.apk"

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"

          mkdir -p ota

          python3 - <<'PY'
          import json
          import os

          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("v")
          release_body = os.environ.get("RELEASE_BODY", "").strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          apk_name = "kontract-express.apk"

          apk_url = (
              f"https://github.com/{repository}/releases/download/"
              f"{tag}/{apk_name}"
          )

          manifest = {
              "version": version,
              "tag": tag,
              "apk": apk_url,
              "changelog": release_body,
          }

          with open("ota/latest.json", "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2, ensure_ascii=False)
              file.write("\n")
          PY

      - name: Commit OTA manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ota/latest.json

          if git diff --cached --quiet; then
            echo "No changes to latest.json"
            exit 0
          fi

          git commit -m "chore: update OTA manifest for ${{ github.event.release.tag_name }}"
          git push
