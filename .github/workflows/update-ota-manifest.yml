name: Update OTA Manifest

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [.github/workflows/update-ota-manifest.yml]

permissions:
  contents: write

jobs:
  update-ota-manifest:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EVENT_TAG" > "$RUNNER_TEMP/release.json"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          fi

      - name: Update ota/native/latest.json
        id: manifest
        run: |
          python3 - <<'PY'
          import json, os

          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "release.json"), encoding="utf-8"))
          tag = r["tag_name"]
          apks = [a["browser_download_url"] for a in r.get("assets", []) if a["name"].endswith(".apk")]
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one .apk asset on {tag}, found {len(apks)}")

          manifest = {
              "version": tag.removeprefix("v"),
              "tag": tag,
              "apk": apks[0],
              "changelog": (r.get("body") or "").strip(),
          }
          os.makedirs("ota/native", exist_ok=True)
          with open("ota/native/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\n")
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Commit and push
        env:
          TAG_NAME: ${{ steps.manifest.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/native/latest.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: update native OTA manifest for $TAG_NAME"
          git push origin main
